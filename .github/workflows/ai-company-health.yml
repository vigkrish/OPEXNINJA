name: OPEX AI Company Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --runInBand

      - name: AI company status snapshot
        if: always()
        run: python ai_company/orchestrator.py

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-company-status
          path: .ai-company-state.json
          if-no-files-found: warn

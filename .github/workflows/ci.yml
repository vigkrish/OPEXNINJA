name: Validate OPEX Ninja web app

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm -w @opexninja/web run lint

      - name: Type-check
        run: npm -w @opexninja/web run type-check

      - name: Build
        env:
          VITE_API_URL: https://opexninja-api.onrender.com/api
          VITE_BASE_PATH: /OPEXNINJA/
        run: npm run build:web

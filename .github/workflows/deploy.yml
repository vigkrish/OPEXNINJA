name: Deploy OPEX Ninja website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint and type-check (web)
        run: |
          npm -w @opexninja/web run lint
          npm -w @opexninja/web run type-check

      - name: Validate VITE_API_URL
        run: |
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "VITE_API_URL is not set. Set it in the workflow, environment, or repository secrets."
            exit 1
          fi
          echo "VITE_API_URL is set"

      - name: Build website
        env:
          VITE_BASE_PATH: /OPEXNINJA/
          VITE_API_URL: https://opexninja-api.onrender.com/api
        run: npm run build:web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy OPEX Ninja website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_API_URL: https://opexninja-api.onrender.com/api
  VITE_BASE_PATH: /OPEXNINJA/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint and type-check (web)
        run: |
          npm -w @opexninja/web run lint
          npm -w @opexninja/web run type-check

      - name: Validate build environment
        run: |
          test -n "$VITE_API_URL"
          test "$VITE_API_URL" = "https://opexninja-api.onrender.com/api"
          test "$VITE_BASE_PATH" = "/OPEXNINJA/"
          echo "VITE_API_URL=$VITE_API_URL"
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"

      - name: Build website
        run: npm run build:web

      - name: Inspect built site
        run: |
          echo "Listing built files..."
          ls -la apps/web/dist || true
          echo "Index head (if present):"
          if [ -f apps/web/dist/index.html ]; then
            head -n 20 apps/web/dist/index.html
          else
            echo "No index.html found in apps/web/dist"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed Pages URL
        run: |
          echo "Deployed page URL: ${{ steps.deployment.outputs.page_url }}"
          curl -I "${{ steps.deployment.outputs.page_url }}" || true
